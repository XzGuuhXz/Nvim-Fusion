name: Neovim config

on:
  push:
    branches: [xzguuhxz]
  pull_request:
    branches: [xzguuhxz]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar git ripgrep fd-find build-essential

      - name: Install Neovim 0.12.2
        run: |
          curl -L --fail -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/v0.12.2/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version

      - name: Validate Lua configuration
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}
        run: |
          mkdir -p "$HOME/.local/share/nvim" "$HOME/.local/state/nvim" "$HOME/.cache/nvim"
          nvim --headless -u "$PWD/init.lua" "+lua assert(vim.fn.has('nvim-0.12') == 1)" "+qa"
